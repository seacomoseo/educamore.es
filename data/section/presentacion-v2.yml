    title: Libro 'Pata de canguro'
    md: |
      ¿Y si la educación pudiera ser más libre, amorosa y auténtica?

      Pata de canguro es una invitación a transformar la manera en que aprendemos, criamos y vivimos. Inspirado en la pedagogía, la naturaleza, la conciencia emocional y la espiritualidad, este libro te guía hacia espacios más humanos, donde el juego, la emoción y el vínculo son protagonistas.

      Un manifiesto para reconectar con nuestro niño interior y acompañar a nuestros pequeños desde el respeto, la creatividad y el amor.

      Descubre "Pata de canguro" y redescubre el placer de aprender.

      [[::touch_app:: ¡Lo quiero!]](https://www.unoeditorial.com/libros/pata-de-canguro/)
