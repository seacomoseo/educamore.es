      hover_alt: Contraportada del cuento 'Mahelet' de Nieves Lara
      url: mailto:info@educamore.es?subject=Quiero%20el%20cuento%20Mahelet
      btn: hide
      id: mahelet
      align: center
      hide_shadow: true
    - title: Cuento 'Mahelet'
      md: |
        Mahelet es una niña india libre y valiente, que encuentra su hogar en la naturaleza: corre descalza, se esconde entre los arbustos y escucha los secretos del río.

        Guiada por su abuelo Tika, el jefe de la tribu, aprende a ver el mundo de una forma especial: a respetar la tierra, a comprender a los animales y a descubrir el poder curativo de las plantas.

        Pero cuando un cambio amenaza el equilibrio de su tribu, Mahelet deberá poner a prueba todo lo que ha aprendido.

        [[::mail:: Pedir a Nieves]](mailto:info@educamore.es?subject=Quiero%20el%20cuento%20Mahelet)
        [[::shopping_cart:: Comprar en Apuleyo]](https://apuleyoediciones.com/producto/mahelet/)
